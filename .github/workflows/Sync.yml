name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 4,10,16,22 * * *" #北京时间 12,18,0,6 点
  workflow_dispatch:     # 支持手动触发

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }} # 仅当是 Fork 仓库时才运行
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 必须设置为 0 以获取所有历史记录进行合并

      - name: Sync and Merge Upstream
        run: |
          # 配置 Git 用户信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加上游仓库并获取更新
          git remote add upstream https://github.com/kitsurato/mini-gkms-box.git
          git fetch upstream
          
          # 将上游修改合并到当前分支
          # 如果有冲突，Git 会尝试自动合并。由于你只是在文件末尾添加了内容，通常不会冲突。
          git merge upstream/main --no-edit || {
            echo "合并冲突！请手动处理。"
            exit 1
          }
          
          # 推送合并后的代码
          git push origin main
